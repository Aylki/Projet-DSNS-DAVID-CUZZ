---
- hosts: all
  vars:
    domain: "ITway.local"
    domain_netbios: "ITWAY"
    admin_password: "A!dmin84/"

  tasks:


    - name: Créer les OUs via PowerShell
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory
        $base = "DC=ITway,DC=local"

        $ous = @(
          @{ Name = "ITWay";         Path = $base },
          @{ Name = "Utilisateurs";  Path = "OU=ITWay,$base" },
          @{ Name = "Groupes";       Path = "OU=ITWay,$base" },
          @{ Name = "Ordinateurs";   Path = "OU=ITWay,$base" },
          @{ Name = "Services";      Path = "OU=ITWay,$base" },
          @{ Name = "IT";            Path = "OU=Utilisateurs,OU=ITWay,$base" },
          @{ Name = "Communication"; Path = "OU=Utilisateurs,OU=ITWay,$base" },
          @{ Name = "Direction";     Path = "OU=Utilisateurs,OU=ITWay,$base" },
          @{ Name = "Production";    Path = "OU=Utilisateurs,OU=ITWay,$base" }
        )

        foreach ($ou in $ous) {
          $dn = "OU=$($ou.Name),$($ou.Path)"
          if (-not (Get-ADOrganizationalUnit -Filter "DistinguishedName -eq '$dn'" -ErrorAction SilentlyContinue)) {
            New-ADOrganizationalUnit -Name $ou.Name -Path $ou.Path -ProtectedFromAccidentalDeletion $false
            Write-Host "OU créée : $dn"
          } else {
            Write-Host "OU existe déjà : $dn"
          }
        }


    - name: Créer les groupes de sécurité via PowerShell
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory
        $path = "OU=Groupes,OU=ITWay,DC=ITway,DC=local"

        $groups = @(
          @{ Name = "GRP-SECU-IT";   Desc = "Groupe des utilisateurs du service informatique" },
          @{ Name = "GRP-SECU-COM";  Desc = "Groupe des utilisateurs du service communication" },
          @{ Name = "GRP-SECU-DIR";  Desc = "Groupe des utilisateurs du service commercial" },
          @{ Name = "GRP-SECU-PROD"; Desc = "Groupe des utilisateurs du service production" }
        )

        foreach ($group in $groups) {
          if (-not (Get-ADGroup -Filter "Name -eq '$($group.Name)'" -ErrorAction SilentlyContinue)) {
            New-ADGroup -Name $group.Name -GroupScope Global -GroupCategory Security `
              -Path $path -Description $group.Desc
            Write-Host "Groupe créé : $($group.Name)"
          } else {
            Write-Host "Groupe existe déjà : $($group.Name)"
          }
        }


    - name: Créer le compte de service svc-keycloak
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory
        $path = "OU=Services,OU=ITWay,DC=ITway,DC=local"
        $pwd  = ConvertTo-SecureString "A!dmin84/" -AsPlainText -Force

        if (-not (Get-ADUser -Filter "SamAccountName -eq 'svc-keycloak'" -ErrorAction SilentlyContinue)) {
          New-ADUser -Name "svc-keycloak" `
            -SamAccountName "svc-keycloak" `
            -UserPrincipalName "svc-keycloak@ITway.local" `
            -GivenName "Service" -Surname "Keycloak" `
            -Description "Compte de service Keycloak SSO" `
            -Path $path `
            -AccountPassword $pwd `
            -PasswordNeverExpires $true `
            -CannotChangePassword $true `
            -Enabled $true
          Write-Host "Compte svc-keycloak créé"
        } else {
          Write-Host "Compte svc-keycloak existe déjà"
        }


    - name: Créer les utilisateurs via PowerShell
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory
        $pwd = ConvertTo-SecureString "A!dmin84/" -AsPlainText -Force
        $base = "DC=ITway,DC=local"

        $users = @(
          @{ Sam = "Vador.it";   First = "Vador"; Last = "IT";   OU = "IT";            Group = "GRP-SECU-IT"   },
          @{ Sam = "Maul.it";   First = "Maul"; Last = "IT";   OU = "IT";            Group = "GRP-SECU-IT"   },
          @{ Sam = "Leia.com";  First = "Leia"; Last = "Com";  OU = "Communication"; Group = "GRP-SECU-COM"  },
          @{ Sam = "Padme.com";  First = "Padme"; Last = "Com";  OU = "Communication"; Group = "GRP-SECU-COM"  },
          @{ Sam = "Yoda.dir";  First = "Yoda"; Last = "Dir";  OU = "Direction";     Group = "GRP-SECU-DIR"  },
          @{ Sam = "Obi_wan.dir";  First = "Obi_wan"; Last = "Dir";  OU = "Direction";     Group = "GRP-SECU-DIR"  },
          @{ Sam = "Luc.prod"; First = "Luc"; Last = "Prod"; OU = "Production";    Group = "GRP-SECU-PROD" },
          @{ Sam = "Anakin.prod"; First = "Anakin"; Last = "Prod"; OU = "Production";    Group = "GRP-SECU-PROD" }
        )

        foreach ($u in $users) {
          $path = "OU=$($u.OU),OU=Utilisateurs,OU=ITWay,$base"
          $profile = "\\SRV-ADS01\Profiles\$($u.Sam)"
          $home    = "\\SRV-ADS01\Profiles\$($u.Sam)\personal"

          if (-not (Get-ADUser -Filter "SamAccountName -eq '$($u.Sam)'" -ErrorAction SilentlyContinue)) {
            New-ADUser -Name "$($u.First) $($u.Last)" `
              -SamAccountName $u.Sam `
              -UserPrincipalName "$($u.Sam)@ITway.local" `
              -GivenName $u.First -Surname $u.Last `
              -Path $path `
              -AccountPassword $pwd `
              -ProfilePath $profile `
              -HomeDirectory $home `
              -HomeDrive "X:" `
              -Enabled $true
            Add-ADGroupMember -Identity $u.Group -Members $u.Sam
            Write-Host "Utilisateur créé : $($u.Sam)"
          } else {
            Write-Host "Utilisateur existe déjà : $($u.Sam)"
          }
        }


    - name: Créer le dossier et le partage Profiles
      ansible.windows.win_shell: |
        $path = "C:\Profiles"
        if (-not (Test-Path $path)) {
          New-Item -Path $path -ItemType Directory
        }
        if (-not (Get-SmbShare -Name "Profiles" -ErrorAction SilentlyContinue)) {
          New-SmbShare -Name "Profiles" -Path $path -FullAccess "Everyone"
          Write-Host "Partage Profiles créé"
        } else {
          Write-Host "Partage Profiles existe déjà"
        }


    - name: Configurer le message d'accueil
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: String
      loop:
        - name: legalnoticecaption
          data: "Avertissement"
        - name: legalnoticetext
          data: "Les accès à ce poste de travail sont réservés aux utilisateurs autorisés. Toute tentative d'accès non autorisée sera sanctionnée."


    - name: Désactiver le compte invité
      ansible.windows.win_shell: |
        Disable-LocalUser -Name "Guest" -ErrorAction SilentlyContinue
        Write-Host "Compte Guest désactivé"


    - name: Configurer les audits de connexion et de politique
      ansible.windows.win_shell: |
        auditpol /set /subcategory:"Logon"                    /success:enable /failure:enable
        auditpol /set /subcategory:"Logoff"                   /success:enable /failure:enable
        auditpol /set /subcategory:"Audit Policy Change"      /success:enable /failure:enable
        auditpol /set /subcategory:"Authorization Policy Change" /success:enable /failure:enable


    - name: Configurer le chiffrement RDP en élevé
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: MinEncryptionLevel
        data: 3
        type: Dword


    - name: Créer les zones DNS inverses
      ansible.windows.win_shell: |
        $zones = @("10.0.4.0/27", "10.0.3.0/28", "192.168.15.0/24")
        foreach ($zone in $zones) {
          try {
            Add-DnsServerPrimaryZone -NetworkId $zone -ReplicationScope "Forest" -ErrorAction SilentlyContinue
            Write-Host "Zone inverse créée : $zone"
          } catch {
            Write-Host "Zone inverse existe déjà : $zone"
          }
        }


    - name: Créer les entrées DNS statiques
      ansible.windows.win_shell: |
        $zone = "ITway.local"
        $records = @(
          @{ Name = "srv-pki";      IP = "10.0.4.3" },
          @{ Name = "srv-sso";      IP = "10.0.4.4" },
          @{ Name = "srv-intranet"; IP = "10.0.4.5" },
          @{ Name = "it-ansible";   IP = "10.0.3.2" },
          @{ Name = "it-graphana";  IP = "10.0.3.3" },
          @{ Name = "it-mgmt";      IP = "10.0.3.4" }
        )
        foreach ($r in $records) {
          if (-not (Get-DnsServerResourceRecord -ZoneName $zone -Name $r.Name -RRType A -ErrorAction SilentlyContinue)) {
            Add-DnsServerResourceRecordA -ZoneName $zone -Name $r.Name -IPv4Address $r.IP
            Write-Host "DNS créé : $($r.Name) -> $($r.IP)"
          } else {
            Write-Host "DNS existe déjà : $($r.Name)"
          }
        }


    - name: Installer FSRM et configurer le quota 100Mo
      ansible.windows.win_shell: |
        $feature = Get-WindowsFeature -Name FS-Resource-Manager
        if ($feature.InstallState -ne "Installed") {
          Install-WindowsFeature -Name FS-Resource-Manager -IncludeManagementTools
          Write-Host "FSRM installé"
        }
        $path = "C:\Profiles"
        if (-not (Get-FsrmQuota -Path $path -ErrorAction SilentlyContinue)) {
          New-FsrmQuota -Path $path -Template "100 MB Limit"
          Write-Host "Quota 100Mo configuré"
        } else {
          Write-Host "Quota déjà configuré"
        }


    - name: Configurer les règles de pare-feu
      ansible.windows.win_shell: |
        $rules = @(
          @{ Name = "WinRM-HTTP";    Port = 5985; Proto = "TCP" },
          @{ Name = "WinRM-HTTPS";   Port = 5986; Proto = "TCP" },
          @{ Name = "RDP";           Port = 3389; Proto = "TCP" },
          @{ Name = "DNS-TCP";       Port = 53;   Proto = "TCP" },
          @{ Name = "DNS-UDP";       Port = 53;   Proto = "UDP" },
          @{ Name = "LDAP";          Port = 389;  Proto = "TCP" },
          @{ Name = "LDAPS";         Port = 636;  Proto = "TCP" },
          @{ Name = "Kerberos-TCP";  Port = 88;   Proto = "TCP" },
          @{ Name = "Kerberos-UDP";  Port = 88;   Proto = "UDP" },
          @{ Name = "GC-LDAP";       Port = 3268; Proto = "TCP" },
          @{ Name = "GC-LDAPS";      Port = 3269; Proto = "TCP" }
        )
        foreach ($rule in $rules) {
          $existing = Get-NetFirewallRule -DisplayName $rule.Name -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-NetFirewallRule -DisplayName $rule.Name -Direction Inbound `
              -Protocol $rule.Proto -LocalPort $rule.Port -Action Allow
            Write-Host "Règle créée : $($rule.Name)"
          } else {
            Write-Host "Règle existe déjà : $($rule.Name)"
          }
        }
