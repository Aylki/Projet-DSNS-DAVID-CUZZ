---
# ansible/group_vars/dmz_vault.yml
# Fichier à chiffrer IMPÉRATIVEMENT avec ansible-vault :
#   ansible-vault encrypt ansible/group_vars/dmz_vault.yml
#
# Variables secrètes pour la DMZ

# ---- Mailcow ----
mailcow_admin_password: "MDP_ADMIN_MAILCOW"
mailcow_db_password: "MDP_DB"
mailcow_db_root_password: "MDP_DB_ROOT"
mail_ldap_bind_password: "MDP_LDAP_BIND"

# ---- WordPress ----
wp_db_name: "wordpress"
wp_db_user: "wp_user"
wp_db_password: "WP-DB-PASSWORD"

# ---- WordPress OIDC (Keycloak) ----
wp_oidc_client_id: "wordpress-dmz"
wp_oidc_client_secret: "WP_OIDC_SECRET"
wp_oidc_endpoint: "https://sso.itway.fr/realms/itway"

# ---- Certificats TLS (contenu PEM) ----
# Préférer copier les fichiers dans roles/<role>/files/
# Ces variables sont en fallback pour les environnements CI/CD
# pki_ca_cert_content: |
#   -----BEGIN CERTIFICATE-----
#   ...
#   -----END CERTIFICATE-----
