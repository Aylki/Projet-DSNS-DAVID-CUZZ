SRV-INTRANET ansible_host=10.0.4.5 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/ansible_ed25519
IT-GRAPHANA ansible_host=10.0.3.3 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/ansible_ed25519

proxy-dmz    ansible_host=10.0.5.2 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/ansible_ed25519
web-dmz      ansible_host=10.0.5.3 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/ansible_ed25519
