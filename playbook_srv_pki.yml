---
- hosts: all
  vars:
    domain: "ITway.local"
    domain_netbios: "ITWAY"
    admin_password: "A!dmin84/"
    profiles_share: "C:\\Profiles"
    profiles_share_name: "Profiles"

  tasks:


    - name: Créer l'OU principale ITWay
      community.windows.win_domain_ou:
        name: ITWay
        path: "DC=ITway,DC=local"
        state: present

    - name: Créer les OUs des services
      community.windows.win_domain_ou:
        name: "{{ item }}"
        path: "OU=ITWay,DC=ITway,DC=local"
        state: present
      loop:
        - Utilisateurs
        - Groupes
        - Ordinateurs
        - Services

    - name: Créer les OUs par service
      community.windows.win_domain_ou:
        name: "{{ item }}"
        path: "OU=Utilisateurs,OU=ITWay,DC=ITway,DC=local"
        state: present
      loop:
        - IT
        - Communication
        - Direction
        - Production


    - name: Créer les groupes de sécurité
      community.windows.win_domain_group:
        name: "{{ item.name }}"
        scope: Global
        category: Security
        path: "OU=Groupes,OU=ITWay,DC=ITway,DC=local"
        description: "{{ item.desc }}"
        state: present
      loop:
        - { name: "GRP-SECU-IT",   desc: "Groupe des utilisateurs du service informatique" }
        - { name: "GRP-SECU-COM",  desc: "Groupe des utilisateurs du service communication" }
        - { name: "GRP-SECU-DIR",  desc: "Groupe des utilisateurs du service commercial" }
        - { name: "GRP-SECU-PROD", desc: "Groupe des utilisateurs du service production" }

    - name: Créer le compte de service svc-keycloak
      community.windows.win_domain_user:
        name: svc-keycloak
        firstname: Service
        surname: Keycloak
        password: "{{ admin_password }}"
        password_never_expires: yes
        user_cannot_change_password: yes
        path: "OU=Services,OU=ITWay,DC=ITway,DC=local"
        description: "Compte de service Keycloak SSO"
        enabled: yes
        state: present


    - name: Créer les utilisateurs IT
      community.windows.win_domain_user:
        name: "{{ item.name }}"
        firstname: "{{ item.first }}"
        surname: "{{ item.last }}"
        password: "{{ admin_password }}"
        password_never_expires: no
        path: "OU=IT,OU=Utilisateurs,OU=ITWay,DC=ITway,DC=local"
        groups:
          - GRP-SECU-IT
        profile_path: "\\\\SRV-ADS01\\Profiles\\{{ item.name }}"
        home_directory: "\\\\SRV-ADS01\\Profiles\\{{ item.name }}\\personal"
        home_drive: "X:"
        enabled: yes
        state: present
      loop:
        - { name: "john.it",  first: "John",  last: "IT" }
        - { name: "jane.it",  first: "Jane",  last: "IT" }


    - name: Créer les utilisateurs Communication
      community.windows.win_domain_user:
        name: "{{ item.name }}"
        firstname: "{{ item.first }}"
        surname: "{{ item.last }}"
        password: "{{ admin_password }}"
        password_never_expires: no
        path: "OU=Communication,OU=Utilisateurs,OU=ITWay,DC=ITway,DC=local"
        groups:
          - GRP-SECU-COM
        profile_path: "\\\\SRV-ADS01\\Profiles\\{{ item.name }}"
        home_directory: "\\\\SRV-ADS01\\Profiles\\{{ item.name }}\\personal"
        home_drive: "X:"
        enabled: yes
        state: present
      loop:
        - { name: "john.com",  first: "John",  last: "Com" }
        - { name: "jane.com",  first: "Jane",  last: "Com" }


    - name: Créer les utilisateurs Direction
      community.windows.win_domain_user:
        name: "{{ item.name }}"
        firstname: "{{ item.first }}"
        surname: "{{ item.last }}"
        password: "{{ admin_password }}"
        password_never_expires: no
        path: "OU=Direction,OU=Utilisateurs,OU=ITWay,DC=ITway,DC=local"
        groups:
          - GRP-SECU-DIR
        profile_path: "\\\\SRV-ADS01\\Profiles\\{{ item.name }}"
        home_directory: "\\\\SRV-ADS01\\Profiles\\{{ item.name }}\\personal"
        home_drive: "X:"
        enabled: yes
        state: present
      loop:
        - { name: "john.dir",  first: "John",  last: "Dir" }
        - { name: "jane.dir",  first: "Jane",  last: "Dir" }


    - name: Créer les utilisateurs Production
      community.windows.win_domain_user:
        name: "{{ item.name }}"
        firstname: "{{ item.first }}"
        surname: "{{ item.last }}"
        password: "{{ admin_password }}"
        password_never_expires: no
        path: "OU=Production,OU=Utilisateurs,OU=ITWay,DC=ITway,DC=local"
        groups:
          - GRP-SECU-PROD
        profile_path: "\\\\SRV-ADS01\\Profiles\\{{ item.name }}"
        home_directory: "\\\\SRV-ADS01\\Profiles\\{{ item.name }}\\personal"
        home_drive: "X:"
        enabled: yes
        state: present
      loop:
        - { name: "john.prod",  first: "John",  last: "Prod" }
        - { name: "jane.prod",  first: "Jane",  last: "Prod" }
        

    - name: Créer le dossier Profiles
      ansible.windows.win_file:
        path: "{{ profiles_share }}"
        state: directory

    - name: Créer le partage réseau Profiles
      community.windows.win_share:
        name: "{{ profiles_share_name }}"
        path: "{{ profiles_share }}"
        full: Everyone
        state: present


    - name: Configurer le message d'accueil via registre
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
      loop:
        - name: legalnoticecaption
          data: "Avertissement"
          type: string
        - name: legalnoticetext
          data: "Les accès à ce poste de travail sont réservés aux utilisateurs autorisés. Toute tentative d'accès non autorisée sera sanctionnée."
          type: string


    - name: Désactiver le compte invité
      ansible.windows.win_user:
        name: Guest
        account_disabled: yes
        state: present


    - name: Configurer les audits de connexion
      ansible.windows.win_shell: |
        auditpol /set /subcategory:"Logon" /success:enable /failure:enable
        auditpol /set /subcategory:"Logoff" /success:enable /failure:enable
        auditpol /set /subcategory:"Audit Policy Change" /success:enable /failure:enable
        auditpol /set /subcategory:"Authorization Policy Change" /success:enable /failure:enable


    - name: Configurer le chiffrement RDP en élevé
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: MinEncryptionLevel
        data: 3
        type: dword


    - name: Bloquer l'enregistrement de fichiers exécutables sur lecteurs réseau
      ansible.windows.win_shell: |
        $gpoName = "Block-Executables-Network"
        Import-Module GroupPolicy
        if (-not (Get-GPO -Name $gpoName -ErrorAction SilentlyContinue)) {
          New-GPO -Name $gpoName
        }
        Set-GPRegistryValue -Name $gpoName `
          -Key "HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" `
          -ValueName "DisallowRun" -Type DWord -Value 1
        New-GPLink -Name $gpoName -Target "DC=ITway,DC=local" -ErrorAction SilentlyContinue


    - name: Créer la zone DNS inverse pour SRV-VLAN (10.0.4.0/27)
      ansible.windows.win_shell: |
        Add-DnsServerPrimaryZone -NetworkId "10.0.4.0/27" -ReplicationScope "Forest" -ErrorAction SilentlyContinue

    - name: Créer la zone DNS inverse pour IT-VLAN (10.0.3.0/28)
      ansible.windows.win_shell: |
        Add-DnsServerPrimaryZone -NetworkId "10.0.3.0/28" -ReplicationScope "Forest" -ErrorAction SilentlyContinue

    - name: Créer la zone DNS inverse pour LAN-VLAN (192.168.15.0/24)
      ansible.windows.win_shell: |
        Add-DnsServerPrimaryZone -NetworkId "192.168.15.0/24" -ReplicationScope "Forest" -ErrorAction SilentlyContinue


    - name: Créer les entrées DNS statiques des serveurs
      ansible.windows.win_shell: |
        $zone = "ITway.local"
        $records = @(
          @{ Name = "srv-ads01";    IP = "10.0.4.2" },
          @{ Name = "srv-pki";      IP = "10.0.4.3" },
          @{ Name = "srv-sso";      IP = "10.0.4.4" },
          @{ Name = "srv-intranet"; IP = "10.0.4.5" },
          @{ Name = "it-ansible";   IP = "10.0.3.2" },
          @{ Name = "it-graphana";  IP = "10.0.3.3" },
          @{ Name = "it-mgmt";      IP = "10.0.3.4" }
        )
        foreach ($record in $records) {
          $existing = Get-DnsServerResourceRecord -ZoneName $zone -Name $record.Name -RRType A -ErrorAction SilentlyContinue
          if (-not $existing) {
            Add-DnsServerResourceRecordA -ZoneName $zone -Name $record.Name -IPv4Address $record.IP
          }
        }

    - name: Créer les enregistrements PTR
      ansible.windows.win_shell: |
        $ptrRecords = @(
          @{ IP = "10.0.4.2"; FQDN = "srv-ads01.ITway.local." },
          @{ IP = "10.0.4.3"; FQDN = "srv-pki.ITway.local." },
          @{ IP = "10.0.4.4"; FQDN = "srv-sso.ITway.local." },
          @{ IP = "10.0.4.5"; FQDN = "srv-intranet.ITway.local." },
          @{ IP = "10.0.3.2"; FQDN = "it-ansible.ITway.local." },
          @{ IP = "10.0.3.3"; FQDN = "it-graphana.ITway.local." },
          @{ IP = "10.0.3.4"; FQDN = "it-mgmt.ITway.local." }
        )
        foreach ($ptr in $ptrRecords) {
          try {
            Add-DnsServerResourceRecordPtr -ZoneName (($ptr.IP -split '\.')[2] + '.' + ($ptr.IP -split '\.')[1] + '.' + ($ptr.IP -split '\.')[0] + '.in-addr.arpa') `
              -Name ($ptr.IP -split '\.')[-1] `
              -PtrDomainName $ptr.FQDN -ErrorAction SilentlyContinue
          } catch {}
        }


    - name: Activer les quotas sur le dossier Profiles
      ansible.windows.win_shell: |
        $fsrmInstalled = Get-WindowsFeature -Name FS-Resource-Manager
        if ($fsrmInstalled.InstallState -ne "Installed") {
          Install-WindowsFeature -Name FS-Resource-Manager -IncludeManagementTools
        }
        $quotaTemplate = "100 MB Limit"
        $path = "C:\Profiles"
        $existing = Get-FsrmQuota -Path $path -ErrorAction SilentlyContinue
        if (-not $existing) {
          New-FsrmQuota -Path $path -Template $quotaTemplate
        }


    - name: Configurer le pare-feu Windows
      ansible.windows.win_shell: |
        # Autoriser WinRM
        netsh advfirewall firewall add rule name="WinRM HTTP"  protocol=TCP dir=in localport=5985 action=allow
        netsh advfirewall firewall add rule name="WinRM HTTPS" protocol=TCP dir=in localport=5986 action=allow
        # Autoriser RDP
        netsh advfirewall firewall add rule name="RDP" protocol=TCP dir=in localport=3389 action=allow
        # Autoriser DNS
        netsh advfirewall firewall add rule name="DNS TCP" protocol=TCP dir=in localport=53 action=allow
        netsh advfirewall firewall add rule name="DNS UDP" protocol=UDP dir=in localport=53 action=allow
        # Autoriser LDAP et LDAPS
        netsh advfirewall firewall add rule name="LDAP"  protocol=TCP dir=in localport=389 action=allow
        netsh advfirewall firewall add rule name="LDAPS" protocol=TCP dir=in localport=636 action=allow
        # Autoriser Kerberos
        netsh advfirewall firewall add rule name="Kerberos TCP" protocol=TCP dir=in localport=88 action=allow
        netsh advfirewall firewall add rule name="Kerberos UDP" protocol=UDP dir=in localport=88 action=allow
